<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Events Lab</title>
    <script defer src="./app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="calculator">
      <div class="row">
        <div class="display"></div>
      </div>
      <div class="row">
        <div class="button number" id="button7">7</div>
        <div class="button number" id="button8">8</div>
        <div class="button number" id="button9">9</div>
        <div class="button operator" id="division">/</div>
      </div>
      <div class="row">
        <div class="button number" id="button4">4</div>
        <div class="button number" id="button5">5</div>
        <div class="button number" id="button6">6</div>
        <div class="button operator" id="multiplication">*</div>
      </div>
      <div class="row">
        <div class="button number" id="button1">1</div>
        <div class="button number" id="button2">2</div>
        <div class="button number" id="button3">3</div>
        <div class="button operator" id="subtraction">-</div>
      </div>
      <div class="row">
        <div class="button operator" id="clear">C</div>
        <div class="button number" id="button0">0</div>
        <div class="button equals" id="equals">=</div>
        <div class="button operator" id="addition">+</div>
      </div>
    </div>
  </body>
</html>
